<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Blog | BlogSpace</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>


<!-- NAVBAR -->

<header>

    <nav class="navbar">

        <a href="index.html"
           class="logo">

            Blog<span>Space</span>

        </a>


        <ul class="nav-links"
            id="navLinks">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="index.html#blogs">
                    Blogs
                </a>
            </li>

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="create-blog.html"
                   class="active">
                    Create Blog
                </a>
            </li>

            <li>

                <button
                    class="logout-btn"
                    id="logoutBtn">

                    Logout

                </button>

            </li>

        </ul>


        <button
            class="menu-btn"
            id="menuBtn">

            ☰

        </button>

    </nav>

</header>



<!-- CREATE BLOG -->

<main class="create-page">


    <div class="create-container">


        <!-- PAGE HEADING -->

        <div class="create-heading">

            <p class="section-small">
                CREATE A STORY
            </p>

            <h1>
                Share your
                <span>ideas.</span>
            </h1>

            <p>
                Write something interesting, helpful or
                inspiring and share it with the community.
            </p>

        </div>



        <!-- FORM -->

        <div class="create-card">


            <form id="createBlogForm">


                <!-- TITLE -->

                <div class="form-group">

                    <label for="blogTitle">
                        Blog Title
                    </label>

                    <input
                        type="text"
                        id="blogTitle"
                        placeholder="Enter an interesting title"
                        required
                    >

                </div>



                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="blogCategory">
                        Category
                    </label>

                    <select
                        id="blogCategory"
                        required
                    >

                        <option value="">
                            Select a category
                        </option>

                        <option value="Technology">
                            Technology
                        </option>

                        <option value="Web Development">
                            Web Development
                        </option>

                        <option value="Programming">
                            Programming
                        </option>

                        <option value="Artificial Intelligence">
                            Artificial Intelligence
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Productivity">
                            Productivity
                        </option>

                        <option value="Lifestyle">
                            Lifestyle
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- IMAGE -->

                <div class="form-group">

                    <label for="blogImage">
                        Cover Image URL
                        <span class="optional">
                            (optional)
                        </span>
                    </label>

                    <input
                        type="url"
                        id="blogImage"
                        placeholder="https://example.com/image.jpg"
                    >

                </div>



                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="blogDescription">
                        Short Description
                    </label>

                    <textarea
                        id="blogDescription"
                        rows="3"
                        placeholder="Give readers a short introduction..."
                        required
                    ></textarea>

                </div>



                <!-- CONTENT -->

                <div class="form-group">

                    <label for="blogContent">
                        Blog Content
                    </label>

                    <textarea
                        id="blogContent"
                        rows="12"
                        placeholder="Start writing your story..."
                        required
                    ></textarea>

                </div>


                <p
                    class="form-message"
                    id="blogMessage">
                </p>



                <!-- ACTIONS -->

                <div class="create-actions">

                    <a
                        href="dashboard.html"
                        class="cancel-btn">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="publish-btn">

                        Publish Blog →

                    </button>

                </div>


            </form>

        </div>

    </div>

</main>


<script src="js/main.js"></script>
<script src="js/create-blog.js"></script>

</body>

</html>
